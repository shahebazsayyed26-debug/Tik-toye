<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kinetica — Tactile Glass & Brass Sound Machine</title>
  <style>
    :root {
      --bg-deep: #0b0f17;
      --bg-panel: rgba(18, 24, 38, 0.82);
      --border-glass: rgba(165, 216, 255, 0.22);
      --border-brass: rgba(245, 194, 107, 0.35);
      --text-main: #eef4fc;
      --text-muted: #8fa3bf;
      --accent-glass: #7dd3fc;
      --accent-brass: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #162033 0%, #090d14 75%, #05070b 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Top HUD */
    .hud-top {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      padding: 8px 14px;
      border-radius: 14px;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #bae6fd 0%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls-top {
      display: flex;
      gap: 8px;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    button, select {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    button:hover, select:hover {
      border-color: var(--accent-glass);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.96);
    }

    button.active {
      border-color: var(--accent-brass);
      background: rgba(245, 158, 11, 0.18);
      color: #fde68a;
    }

    /* Bottom Toolbar */
    .hud-bottom {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px;
      border-radius: 20px;
      display: flex;
      gap: 6px;
      z-index: 10;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      max-width: 96vw;
      overflow-x: auto;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 66px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 11px;
      gap: 4px;
    }

    .tool-btn span.icon {
      font-size: 17px;
      line-height: 1;
    }

    .tool-btn.active {
      background: rgba(125, 211, 252, 0.15);
      border-color: var(--accent-glass);
      color: #fff;
    }

    .tool-btn.brass.active {
      background: rgba(245, 158, 11, 0.16);
      border-color: var(--accent-brass);
      color: #fde68a;
    }

    .hint-pill {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0.9;
      transition: opacity 0.4s;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="hud-top">
    <div class="brand">
      <h1>KINETICA</h1>
      <select id="scaleSelect" title="Musical Scale">
        <option value="pentatonic">Celestial Pentatonic</option>
        <option value="yaman">Raga Yaman</option>
        <option value="bhupali">Raga Bhupali</option>
      </select>
    </div>

    <div class="controls-top">
      <button id="autoStreamBtn">Auto Drop: OFF</button>
      <button id="presetCascade">Cascade</button>
      <button id="presetWheel">Chime Wheel</button>
      <button id="clearPiecesBtn">Clear</button>
    </div>
  </div>

  <div class="hint-pill" id="hintPill">Tap empty space to drop Crystal Orbs • Drag across to draw Glass & Brass pieces</div>

  <canvas id="world"></canvas>

  <div class="hud-bottom">
    <button class="tool-btn active" data-tool="orb">
      <span class="icon">🔮</span>
      <span>Drop Orb</span>
    </button>
    <button class="tool-btn" data-tool="glassRamp">
      <span class="icon">💎</span>
      <span>Glass Ramp</span>
    </button>
    <button class="tool-btn brass" data-tool="brassPlate">
      <span class="icon">🪙</span>
      <span>Brass Plate</span>
    </button>
    <button class="tool-btn" data-tool="crystalBell">
      <span class="icon">🎐</span>
      <span>Crystal Bell</span>
    </button>
    <button class="tool-btn brass" data-tool="brassGong">
      <span class="icon">🪘</span>
      <span>Brass Gong</span>
    </button>
    <button class="tool-btn brass" data-tool="spinner">
      <span class="icon">⚙️</span>
      <span>Spinner</span>
    </button>
    <button class="tool-btn" data-tool="erase">
      <span class="icon">🧹</span>
      <span>Erase</span>
    </button>
  </div>

  <script>
    /**
     * KINETICA — Procedural Glass & Brass Physics + Web Audio ASMR Engine
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // ==========================================
    // 1. PROCEDURAL ASMR WEB AUDIO ENGINE
    // ==========================================
    let audioCtx = null;
    let masterGain = null;
    let reverbNode = null;

    const SCALES = {
      pentatonic: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50],
      yaman:      [261.63, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 739.99, 783.99],
      bhupali:    [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00]
    };
    let currentScale = 'pentatonic';

    function initAudio() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.55;

      // Lush Algorithmic Convolution Reverb
      reverbNode = audioCtx.createConvolver();
      const rate = audioCtx.sampleRate;
      const length = rate * 2.2;
      const impulse = audioCtx.createBuffer(2, length, rate);
      for (let c = 0; c < 2; c++) {
        const channel = impulse.getChannelData(c);
        for (let i = 0; i < length; i++) {
          channel[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.8);
        }
      }
      reverbNode.buffer = impulse;

      const reverbWet = audioCtx.createGain();
      reverbWet.gain.value = 0.34;

      masterGain.connect(audioCtx.destination);
      masterGain.connect(reverbNode);
      reverbNode.connect(reverbWet);
      reverbWet.connect(audioCtx.destination);
    }

    function getNoteFrequency(yPos, sizeFactor = 0.5) {
      const notes = SCALES[currentScale];
      const norm = 1 - Math.max(0, Math.min(1, yPos / height));
      const idx = Math.floor((norm * 0.7 + sizeFactor * 0.3) * (notes.length - 1));
      return notes[Math.max(0, Math.min(notes.length - 1, idx))];
    }

    function playMaterialSound(type, velocity, yPos, sizeFactor = 0.5) {
      initAudio();
      if (!audioCtx) return;

      const intensity = Math.min(1, Math.max(0.08, velocity / 14));
      if (intensity < 0.09) return;

      const now = audioCtx.currentTime;
      const baseFreq = getNoteFrequency(yPos, sizeFactor);

      if (type === 'glassRamp' || type === 'crystalBell') {
        // Pure crystalline sine + shimmer overtone
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        const pitchShift = type === 'crystalBell' ? 1.5 : 1.0;
        osc1.frequency.setValueAtTime(baseFreq * pitchShift, now);
        osc2.frequency.setValueAtTime(baseFreq * pitchShift * 2.756, now); // Crystalline harmonic

        const decay = type === 'crystalBell' ? 1.45 : 0.65;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(intensity * 0.35, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + decay);

        const highGain = audioCtx.createGain();
        highGain.gain.value = 0.18;

        osc1.connect(gain);
        osc2.connect(highGain);
        highGain.connect(gain);
        gain.connect(masterGain);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + decay);
        osc2.stop(now + decay);
      } else {
        // Warm FM Brass Resonance (brassPlate, brassGong, spinner)
        const carrier = audioCtx.createOscillator();
        const modulator = audioCtx.createOscillator();
        const modGain = audioCtx.createGain();
        const outGain = audioCtx.createGain();

        const pitchMult = type === 'brassGong' ? 0.5 : 0.75;
        const freq = baseFreq * pitchMult;

        carrier.type = 'sine';
        carrier.frequency.setValueAtTime(freq, now);

        modulator.type = 'sine';
        modulator.frequency.setValueAtTime(freq * 1.414, now); // Metallic FM ratio

        const decay = type === 'brassGong' ? 2.1 : 0.95;
        modGain.gain.setValueAtTime(freq * intensity * 1.4, now);
        modGain.gain.exponentialRampToValueAtTime(1, now + decay * 0.6);

        outGain.gain.setValueAtTime(0.001, now);
        outGain.gain.linearRampToValueAtTime(intensity * 0.42, now + 0.01);
        outGain.gain.exponentialRampToValueAtTime(0.0001, now + decay);

        modulator.connect(modGain);
        modGain.connect(carrier.frequency);
        carrier.connect(outGain);
        outGain.connect(masterGain);

        carrier.start(now);
        modulator.start(now);
        carrier.stop(now + decay);
        modulator.stop(now + decay);
      }
    }

    // ==========================================
    // 2. PHYSICS ENTITIES & STATE
    // ==========================================
    const GRAVITY = 0.28;
    const AIR_DRAG = 0.996;

    let orbs = [];
    let segments = []; // { x1, y1, x2, y2, type, glow, id }
    let bumpers = [];  // { x, y, r, type, glow }
    let spinners = []; // { x, y, len, angle, speed, glow }
    let ripples = [];  // Visual shockwaves & sparks
    let spawners = []; // Auto-drop emitters

    let activeTool = 'orb';
    let isDrawing = false;
    let dragStart = null;
    let dragCurrent = null;
    let autoDrop = false;
    let frameCount = 0;

    function spawnOrb(x, y, vx = (Math.random() - 0.5) * 1.2, vy = 0) {
      if (orbs.length > 45) orbs.shift();
      const hue = 195 + Math.random() * 25;
      orbs.push({
        x, y, vx, vy,
        r: 9 + Math.random() * 3,
        hue,
        trail: [],
        lastHitId: null,
        lastHitTime: 0
      });
    }

    function createRipple(x, y, color, maxR = 45) {
      ripples.push({ x, y, r: 6, maxR, alpha: 0.9, color });
    }

    // ==========================================
    // 3. PRESET MACHINES
    // ==========================================
    function loadCascadePreset() {
      segments = [];
      bumpers = [];
      spinners = [];
      spawners = [{ x: width * 0.35, y: 85 }];

      const cx = width * 0.5;
      const topY = height * 0.24;

      // Alternating Glass & Brass musical steps
      segments.push({ x1: cx - 190, y1: topY, x2: cx - 35, y2: topY + 65, type: 'glassRamp', glow: 0 });
      segments.push({ x1: cx + 165, y1: topY + 95, x2: cx + 10, y2: topY + 165, type: 'brassPlate', glow: 0 });
      segments.push({ x1: cx - 175, y1: topY + 195, x2: cx - 15, y2: topY + 265, type: 'glassRamp', glow: 0 });
      segments.push({ x1: cx + 185, y1: topY + 295, x2: cx + 20, y2: topY + 365, type: 'brassPlate', glow: 0 });

      bumpers.push({ x: cx - 10, y: topY + 95, r: 22, type: 'crystalBell', glow: 0 });
      bumpers.push({ x: cx + 15, y: topY + 200, r: 26, type: 'brassGong', glow: 0 });
      spinners.push({ x: cx - 30, y: topY + 310, len: 68, angle: 0.3, speed: 0.032, glow: 0 });

      spawnOrb(width * 0.35, 95);
    }

    function loadWheelPreset() {
      segments = [];
      bumpers = [];
      spinners = [];
      const cx = width * 0.5;
      const cy = height * 0.52;
      spawners = [{ x: cx - 45, y: 85 }, { x: cx + 45, y: 85 }];

      spinners.push({ x: cx, y: cy, len: 95, angle: 0, speed: 0.025, glow: 0 });

      const count = 6;
      const ringR = Math.min(width, height) * 0.28;
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2;
        bumpers.push({
          x: cx + Math.cos(a) * ringR,
          y: cy + Math.sin(a) * ringR,
          r: i % 2 === 0 ? 22 : 26,
          type: i % 2 === 0 ? 'crystalBell' : 'brassGong',
          glow: 0
        });
      }

      // Catcher ramps below
      segments.push({ x1: cx - 210, y1: cy + ringR + 30, x2: cx - 40, y2: cy + ringR + 95, type: 'glassRamp', glow: 0 });
      segments.push({ x1: cx + 210, y1: cy + ringR + 30, x2: cx + 40, y2: cy + ringR + 95, type: 'brassPlate', glow: 0 });

      spawnOrb(cx - 45, 95);
      setTimeout(() => spawnOrb(cx + 45, 95), 450);
    }

    // ==========================================
    // 4. COLLISION & PHYSICS STEP
    // ==========================================
    function resolveLineCollision(orb, x1, y1, x2, y2, restitution, materialType, objRef) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return;

      let t = ((orb.x - x1) * dx + (orb.y - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));

      const closestX = x1 + t * dx;
      const closestY = y1 + t * dy;
      const distX = orb.x - closestX;
      const distY = orb.y - closestY;
      const dist = Math.hypot(distX, distY);

      const thickness = 5;
      if (dist < orb.r + thickness && dist > 0.0001) {
        const nx = distX / dist;
        const ny = distY / dist;

        // Separate orb from surface
        const overlap = (orb.r + thickness) - dist;
        orb.x += nx * overlap;
        orb.y += ny * overlap;

        const vn = orb.vx * nx + orb.vy * ny;
        if (vn < 0) {
          const impactSpeed = Math.abs(vn);
          orb.vx -= (1 + restitution) * vn * nx;
          orb.vy -= (1 + restitution) * vn * ny;

          // Slight tangential friction
          orb.vx *= 0.992;

          if (impactSpeed > 1.3) {
            objRef.glow = 1.0;
            const color = materialType.includes('brass') ? '#fbbf24' : '#7dd3fc';
            createRipple(closestX, closestY, color, 28 + impactSpeed * 2);
            playMaterialSound(materialType, impactSpeed, closestY, 1 - t);
          }
        }
      }
    }

    function updatePhysics() {
      frameCount++;

      if (autoDrop && frameCount % 75 === 0) {
        if (spawners.length > 0) {
          const sp = spawners[Math.floor(Math.random() * spawners.length)];
          spawnOrb(sp.x + (Math.random() - 0.5) * 16, sp.y);
        } else {
          spawnOrb(width * (0.3 + Math.random() * 0.4), 85);
        }
      }

      // Update spinners
      for (const s of spinners) {
        s.angle += s.speed;
        s.glow *= 0.92;
      }

      for (const seg of segments) seg.glow *= 0.92;
      for (const b of bumpers) b.glow *= 0.92;

      // Update Orbs
      for (let i = orbs.length - 1; i >= 0; i--) {
        const orb = orbs[i];
        orb.vy += GRAVITY;
        orb.vx *= AIR_DRAG;
        orb.vy *= AIR_DRAG;

        orb.x += orb.vx;
        orb.y += orb.vy;

        orb.trail.push({ x: orb.x, y: orb.y });
        if (orb.trail.length > 14) orb.trail.shift();

        // Walls
        if (orb.x < orb.r) { orb.x = orb.r; orb.vx *= -0.75; }
        if (orb.x > width - orb.r) { orb.x = width - orb.r; orb.vx *= -0.75; }

        // Remove if fallen off bottom
        if (orb.y > height + 60) {
          orbs.splice(i, 1);
          continue;
        }

        // Segment collisions
        for (const seg of segments) {
          const bounce = seg.type === 'brassPlate' ? 0.88 : 0.72;
          resolveLineCollision(orb, seg.x1, seg.y1, seg.x2, seg.y2, bounce, seg.type, seg);
        }

        // Spinner collisions
        for (const s of spinners) {
          const x1 = s.x - Math.cos(s.angle) * s.len;
          const y1 = s.y - Math.sin(s.angle) * s.len;
          const x2 = s.x + Math.cos(s.angle) * s.len;
          const y2 = s.y + Math.sin(s.angle) * s.len;
          resolveLineCollision(orb, x1, y1, x2, y2, 0.92, 'brassPlate', s);
        }

        // Bumper collisions (Crystal Bell & Brass Gong)
        for (const b of bumpers) {
          const dx = orb.x - b.x;
          const dy = orb.y - b.y;
          const dist = Math.hypot(dx, dy);
          const minDist = orb.r + b.r;
          if (dist < minDist && dist > 0.001) {
            const nx = dx / dist;
            const ny = dy / dist;
            orb.x += nx * (minDist - dist);
            orb.y += ny * (minDist - dist);

            const speed = Math.hypot(orb.vx, orb.vy);
            const boost = b.type === 'brassGong' ? Math.max(speed * 1.08, 6.5) : Math.max(speed * 0.98, 5.2);
            orb.vx = nx * boost;
            orb.vy = ny * boost;

            b.glow = 1.0;
            const color = b.type === 'brassGong' ? '#f59e0b' : '#38bdf8';
            createRipple(b.x, b.y, color, b.r * 2.4);
            playMaterialSound(b.type, boost, b.y, 1 - (b.r / 40));
          }
        }
      }

      // Update Ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += (rp.maxR - rp.r) * 0.14;
        rp.alpha -= 0.032;
        if (rp.alpha <= 0) ripples.splice(i, 1);
      }
    }

    // ==========================================
    // 5. TACTILE GLASS & BRASS RENDERER
    // ==========================================
    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Subtle architectural grid
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.04)';
      ctx.lineWidth = 1;
      const step = 48;
      for (let x = 0; x < width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      // Draw Spawners
      for (const sp of spawners) {
        ctx.beginPath();
        ctx.arc(sp.x, sp

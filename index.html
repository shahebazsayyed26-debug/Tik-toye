<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>SFC Coin — Secure Future Coin</title>

<!-- Modern Web3 Provider (Ethers v5) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#050b14;
    --card:rgba(13,25,43,.78);
    --border:rgba(255,255,255,.09);
    --text:#f7fbff;
    --muted:#8fa2b8;
    --green:#35e29a;
    --gold:#ffd35a;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(32,224,255,.12),transparent 28%),
        radial-gradient(circle at 90% 15%,rgba(77,163,255,.12),transparent 30%),
        linear-gradient(145deg,#030711,#071321 55%,#030811);
    color:var(--text);
    min-height:100vh;
    padding-bottom:30px;
}

.container{
    width:min(500px,100%);
    margin:auto;
    padding:20px 16px;
}

header{
    text-align:center;
    padding:15px 0;
}

.mini-logo{
    width:70px;
    height:70px;
    border-radius:50%;
    margin:0 auto 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:900;
    color:#04111d;
    background:linear-gradient(145deg,#fff,#3edcff 35%,#2879ff);
    box-shadow:0 0 25px rgba(32,224,255,.4);
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
    backdrop-filter:blur(16px);
    margin-bottom:16px;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:6px 12px;
    border-radius:20px;
    background:rgba(53,226,154,.1);
    border:1px solid rgba(53,226,154,.25);
    color:var(--green);
    font-size:11px;
    font-weight:700;
    margin-bottom:12px;
}

.info-box{
    background:rgba(7,18,31,.8);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    margin:15px 0;
    font-size:13px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.info-row:last-child{ margin-bottom:0; }

.primary-btn{
    width:100%;
    padding:15px;
    border-radius:14px;
    color:#03101c;
    font-weight:900;
    background:linear-gradient(100deg,#20e0ff,#4da3ff);
    box-shadow:0 10px 25px rgba(32,180,255,.18);
    border:0;
    cursor:pointer;
    margin-top:10px;
    font-size:15px;
}

.primary-btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

#status{
    font-size:12px;
    color:#38bdf8;
    margin-top:12px;
    text-align:center;
    word-break:break-all;
}

.lock-notice{
    color:#ff5c76;
    font-size:11px;
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <header>
        <div class="mini-logo">SF</div>
        <h2>SECURE & FUTURE (SF)</h2>
        <p style="color:var(--muted); font-size:12px; margin-top:4px;">SAFE TODAY • STRONG TOMORROW</p>
    </header>

    <div class="card">
        <div style="text-align:center;">
            <span class="badge">● PRESALE LIVE (BEP-20)</span>
        </div>

        <div class="info-box">
            <div class="info-row">
                <span style="color:var(--muted);">Package OFFER:</span>
                <strong>₹200 = 100 SF Coins</strong>
            </div>
            <div class="info-row">
                <span style="color:var(--muted);">USDT Payable:</span>
                <strong style="color:var(--green);">2.30 USDT (BSC)</strong>
            </div>
            <div class="info-row">
                <span style="color:var(--muted);">Rate Increase:</span>
                <strong style="color:var(--gold);">+₹0.0003 / Purchase</strong>
            </div>
        </div>

        <button class="primary-btn" id="connectBtn" onclick="connectWallet()">1. Connect Wallet</button>
        <button class="primary-btn" id="payBtn" onclick="payUSDT()" style="background:linear-gradient(100deg,#ffd35a,#ffb703);">2. Pay 2.30 USDT & Buy</button>

        <div id="status">Click "Connect Wallet" to start</div>
        <div class="lock-notice">🔒 All purchased coins are LOCKED for 12 Months.</div>
    </div>

</div>

<script>
    // Config
    const RECEIVER_WALLET = "0x00f8a228207dd6dF2De6b02a0c8E14537FB5364b"; 
    const USDT_BSC_CONTRACT = "0x55d398326f99059fF775485246999027B3197955"; 

    let provider, signer, userAddress;

    async function connectWallet() {
        const statusEl = document.getElementById("status");
        statusEl.innerText = "Connecting...";

        try {
            if (window.ethereum) {
                provider = new ethers.providers.Web3Provider(window.ethereum, "any");
                await provider.send("eth_requestAccounts", []);
                
                // Switch/Add BSC Network (ChainId: 56 / 0x38)
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x38' }],
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x38',
                                chainName: 'BNB Smart Chain',
                                nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                                rpcUrls: ['https://bsc-dataseed.binance.org/'],
                                blockExplorerUrls: ['https://bscscan.com/']
                            }]
                        });
                    }
                }

                signer = provider.getSigner();
                userAddress = await signer.getAddress();

                statusEl.innerText = "Connected: " + userAddress.substring(0,6) + "..." + userAddress.substring(userAddress.length - 4);
                document.getElementById("connectBtn").innerText = "✓ Connected";
            } else {
                alert("Please open this page inside Trust Wallet Browser or MetaMask DApp Browser!");
                statusEl.innerText = "❌ No Web3 Wallet Detected";
            }
        } catch (error) {
            console.error(error);
            statusEl.innerText = "❌ Connection failed/rejected.";
        }
    }

    async function payUSDT() {
        const statusEl = document.getElementById("status");

        if (!userAddress || !signer) {
            alert("Pehle 'Connect Wallet' button dabayein!");
            return;
        }

        try {
            statusEl.innerText = "Please confirm transaction in your wallet...";

            const abi = ["function transfer(address to, uint256 value) returns (bool)"];
            const usdtContract = new ethers.Contract(USDT_BSC_CONTRACT, abi, signer);

            // 2.30 USDT with 18 decimals
            const amount = ethers.utils.parseUnits("2.30", 18);

            const tx = await usdtContract.transfer(RECEIVER_WALLET, amount);
            statusEl.innerText = "Processing... Tx Hash: " + tx.hash.substring(0, 12) + "...";

            await tx.wait();
            statusEl.innerText = "✅ Transaction Successful! 100 SF Coins locked for 12 months.";
            alert("Payment Received! 100 SF Coins allocated.");
        } catch (error) {
            console.error(error);
            statusEl.innerText = "❌ Transaction Failed or Cancelled.";
        }
    }
</script>

</body>
</html>

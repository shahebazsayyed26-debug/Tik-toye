<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy SF Coin - Secure & Future</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: white; text-align: center; padding: 20px; }
        .card { background: #151c2c; border: 2px solid #eab308; padding: 20px; border-radius: 16px; max-width: 380px; margin: auto; box-shadow: 0 0 15px rgba(234, 179, 8, 0.3); }
        .logo { width: 140px; height: 140px; border-radius: 50%; border: 3px solid #eab308; margin-bottom: 10px; }
        h2 { color: #facc15; margin: 5px 0; }
        .info { background: #1e293b; padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 14px; border: 1px solid #334155; }
        button { background: linear-gradient(135deg, #eab308, #ca8a04); color: black; font-weight: bold; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
        #status { font-size: 13px; color: #38bdf8; margin-top: 15px; word-break: break-all; }
        .lock-notice { color: #ef4444; font-size: 12px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://i.ibb.co/SF-Coin-Logo.png" alt="SF Coin" class="logo">
    
    <h2>SECURE & FUTURE (SF)</h2>
    <p style="font-size:12px; color:#94a3b8;">SAFE TODAY • STRONG TOMORROW</p>

    <div class="info">
        <p style="margin:3px 0;"><b>Offer:</b> ₹200 = 100 SF Coins</p>
        <p style="margin:3px 0; color:#4ade80;"><b>Payment:</b> ~2.30 USDT</p>
        <p style="margin:3px 0; color:#facc15;"><b>Rate Increase:</b> +₹0.0003 / Buy</p>
    </div>

    <button onclick="connectWallet()">1. Connect Wallet</button>
    <br>
    <button onclick="payUSDT()">2. Pay 2.30 USDT (₹200) & Buy</button>

    <div class="lock-notice">🔒 Purchased coins will be LOCKED for 12 Months.</div>
    <p id="status"></p>
</div>

<script>
    // Aapka Image se mila USDT Receiver Wallet Address
    const MY_USDT_RECEIVER = "0x00f8a228207dd6dF2De6b02a0c8E14537FB5364b"; 

    // USDT Contract Address (Default ERC20 Tether)
    const USDT_CONTRACT = "0xdAC17F958D2ee523a2206206994597C13D831ec7"; 

    let userAddress = "";
    let provider, signer;

    async function connectWallet() {
        if (window.ethereum) {
            provider = new ethers.providers.Web3Provider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            signer = provider.getSigner();
            userAddress = accounts[0];
            document.getElementById("status").innerText = "Connected: " + userAddress.substring(0,6) + "..." + userAddress.substring(38);
        } else {
            alert("Trust Wallet ya MetaMask browser me open karein!");
        }
    }

    async function payUSDT() {
        if (!userAddress) {
            alert("Pehle Wallet Connect karein!");
            return;
        }

        try {
            document.getElementById("status").innerText = "Processing Payment...";
            
            const usdtAbi = ["function transfer(address to, uint256 amount) returns (bool)"];
            const usdtContract = new ethers.Contract(USDT_CONTRACT, usdtAbi, signer);

            // 2.30 USDT (ERC20 uses 6 decimals)
            const amountInUnits = ethers.utils.parseUnits("2.30", 6);

            const tx = await usdtContract.transfer(MY_USDT_RECEIVER, amountInUnits);
            document.getElementById("status").innerText = "Tx Sent! Waiting... Tx Hash: " + tx.hash;

            await tx.wait();
            document.getElementById("status").innerText = "✅ Payment Successful! 100 SF Coins locked for 12 Months.";
        } catch (error) {
            console.error(error);
            document.getElementById("status").innerText = "❌ Payment Failed / Cancelled.";
        }
    }
</script>

</body>
</html>
